name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      # RC1-261. The free half of the drift-digest goldens: the empty-findings
      # path never reaches a model, so it needs no key and costs nothing. The
      # billed half (`python -m evals run drift-digest`) is run by hand — see
      # evals/subjects.py for why the split is by cost rather than by coverage.
      - name: Evals (free subjects only)
        run: python -m evals run drift-digest-allclear
