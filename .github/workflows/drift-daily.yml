# Daily scheduler for the drift detector: a cron that POSTs /drift/run on the
# deployed Fly app. Enable by setting repo secrets DRIFT_URL
# (e.g. https://tpm-drift-detector.fly.dev) and DRIFT_RUN_TOKEN.
name: Daily drift run

on:
  schedule:
    # Off the top of the hour on purpose: :00 crons — 13:00 UTC especially —
    # sit in GitHub's most congested queue, and this one drifted from ~30 min
    # late to ~10 h late over a week (RC1-335). Best-effort either way.
    - cron: "17 12 * * *" # 12:17 UTC daily
  workflow_dispatch: {}

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /drift/run
        env:
          DRIFT_URL: ${{ secrets.DRIFT_URL }}
          DRIFT_RUN_TOKEN: ${{ secrets.DRIFT_RUN_TOKEN }}
        run: |
          if [ -z "$DRIFT_URL" ]; then
            echo "DRIFT_URL secret not set — skipping (set DRIFT_URL to enable the daily run)."
            exit 0
          fi
          # Wake the machine before asking it to work. Fly scales this app to
          # zero, and a cold start is not ready when it first says it is: on
          # 2026-09-17 the app logged "Application startup complete" and served
          # /healthz 200 at 13:26:12, and the POST two seconds later still came
          # back 502 — "connection reset by peer" from the proxy, never reaching
          # uvicorn. One healthy read is not enough, which is the same finding
          # RC1-355 made for deploys, so use the same rule: three in a row.
          #
          # GET /healthz and not the POST, because /drift/run writes findings and
          # retrying it could run the job twice.
          deadline=$((SECONDS + 120))
          ok=0
          while [ "$ok" -lt 3 ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$DRIFT_URL/healthz never stayed healthy for 3 consecutive checks within 120s"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$DRIFT_URL/healthz")
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
              echo "warm ($ok/3)"
            else
              ok=0
              echo "not warm yet (HTTP $code)"
            fi
            [ "$ok" -ge 3 ] || sleep 5
          done

          curl -fsS -X POST "$DRIFT_URL/drift/run" \
            -H "X-Drift-Token: $DRIFT_RUN_TOKEN" \
            -w '\nHTTP %{http_code}\n'

      # Heartbeat for the drift detector's SLO (RC1-456). The service emits no
      # metric of its own, and a CI-pipelines monitor cannot back an SLO —
      # Datadog rejects it with "not supported SLO" — so the scheduled run says
      # so itself, the same shape agent-evals already uses for its publish.
      #
      # Only runs when the POST above succeeded: curl -f exits non-zero on an
      # error status, which fails the step and leaves the heartbeat stale. That
      # is the point — a silent skip would keep the SLO green through an outage.
      - name: Report the run to Datadog
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DD_API_KEY" ]; then
            echo "::warning title=Drift heartbeat skipped::DD_API_KEY not set — the SLO will read this run as a miss."
            exit 0
          fi
          # `type` is an INTEGER enum on /api/v2/series: 0 unspecified, 1 count,
          # 2 rate, 3 gauge. The string "gauge" is rejected with
          # `unknown value ... for enum datadoghq.api.series.v2.MetricType`.
          payload=$(printf '{"series":[{"metric":"drift.scheduled_run.ok","type":3,"points":[{"timestamp":%s,"value":1}],"tags":["service:tpm-drift-detector","env:prod"]}]}' "$(date +%s)")
          code=$(curl -s -o resp.json -w '%{http_code}' -m 30 -X POST \
            -H "DD-API-KEY: $DD_API_KEY" -H "Content-Type: application/json" \
            -d "$payload" "https://api.datadoghq.com/api/v2/series")
          cat resp.json; echo
          case "$code" in
            2*) echo "drift heartbeat recorded (HTTP $code)";;
            *) echo "::error::heartbeat POST failed with HTTP $code — the run happened but the SLO will not see it"; exit 1;;
          esac
