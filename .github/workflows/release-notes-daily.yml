# The daily sweep of yesterday's release notes in Confluence (RC1-497,
# RC1-502).
#
# Each deploy writes its own entry as it lands (release-notify.yml). This job
# is the net under that: for every service that deployed yesterday it checks
# the day's entry on the service's page under "Release Notes" in the RC1
# space, writes the ones that are missing or wrong, and posts one #releases
# message linking the pages it had to change. Reads successful deploy runs
# only, so a merge whose deploy failed is not reported as shipped.
#
# This is the one scheduled job here that writes outside Datadog metrics. It
# publishes a report; it does not sync infrastructure state, which is what
# the no-auto-sync rule is about.
#
# A page that is already right is left alone: no model call, no new page
# version, no message. To backfill a day, run it by hand with a date.
name: Release notes

on:
  schedule:
    # A "day" is a day in America/New_York. 05:23 UTC is past local midnight
    # in both EST (05:00) and EDT (04:00), so "yesterday" is always complete.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Local day to write, YYYY-MM-DD (default yesterday)
        required: false
        type: string

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write the day's entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # One Atlassian API token serves Jira and Confluence.
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          # Without the key an entry the sweep writes is the PR list alone.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DAY: ${{ inputs.date }}
        run: |
          set -o pipefail
          # A skipped job looks like a passing one in the run list (RC1-378),
          # so say so where it can be seen.
          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "::warning title=Release notes skipped::JIRA_EMAIL / JIRA_API_TOKEN not set — nothing written today."
            echo "Set both repo secrets to enable the daily release notes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m kpi.release_notes digest ${DAY:+--date "$DAY"} | tee -a "$GITHUB_STEP_SUMMARY"
