apiVersion: v3
kind: service
metadata:
  name: api-compatibility-lab
  displayName: API Compatibility Lab
  description: >-
    Replays sanitized API traffic across two Stripe API versions to find the
    behavioral breaks a schema diff misses, maps them to affected customer
    workflows, and generates pinned regression tests that pass on the old
    version and fail on the new one. Phases 0-6 of RC1-603; not a finished
    tool.
  owner: reid
  tags:
    - repo:api-compatibility-lab
    - apm-service:api-compatibility-lab
  links:
    - name: Repository
      type: repo
      provider: GitHub
      url: https://github.com/snacksnack/api-compatibility-lab
    - name: Epic RC1-603
      type: doc
      url: https://hirereidcollins.atlassian.net/browse/RC1-603
    - name: Detection quality
      type: dashboard
      url: https://app.datadoghq.com/dashboard/94d-gks-ii2
spec:
  lifecycle: development
  tier: "3"
  languages:
    - python
  type: library
datadog:
  pipelines:
    fingerprints:
      - "whsvIVGNhfvv"   # CI
      - "zxSdGGAFQBYL"   # CodeQL
  codeLocations:
    - repositoryURL: https://github.com/snacksnack/api-compatibility-lab
      paths:
        - "**"
