apiVersion: v3
kind: service
metadata:
  name: incident-summarizer
  displayName: AI Incident Summarizer
  description: >-
    Ingests CloudWatch and Datadog alerts, normalizes and dedupes them, then
    summarizes and delivers to Slack, Jira and Datadog events. Two Lambdas
    (ingest, summarizer) behind an API Gateway, deployed by CloudFormation.
  owner: reid
  tags:
    - platform:aws-lambda
    - deploy:github-actions
    - repo:ai-incident-summarizer
    - ml-app:incident-summarizer
  links:
    - name: Repository
      type: repo
      provider: GitHub
      url: https://github.com/snacksnack/ai-incident-summarizer
    - name: Delivery — CI pipelines & deploys
      type: dashboard
      url: https://app.datadoghq.com/dashboard/izc-5s7-tz8
    - name: Production endpoint
      type: other
      url: https://incidents.hihelloreid.com
spec:
  lifecycle: production
  tier: "2"
  languages:
    - python
  type: web
datadog:
  pipelines:
    fingerprints:
      - "UZqQAM9Gn9Ka"   # CI
      - "vuzqPvU-pzkx"   # Deploy
  codeLocations:
    - repositoryURL: https://github.com/snacksnack/ai-incident-summarizer
      paths:
        - "**"
