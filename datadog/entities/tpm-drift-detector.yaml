apiVersion: v3
kind: service
metadata:
  name: tpm-drift-detector
  displayName: TPM Drift Detector
  description: >-
    Flags upstream schedule slips that downstream plans have not absorbed.
    The platform's first service; deploys to Fly on every push to main.
  owner: reid
  tags:
    - platform:fly
    - deploy:github-actions
    - repo:tpm-automation-platform
    # APM was 'drift-service' until RC1-447 set DD_SERVICE in fly.toml; it now
    # matches this entity and the DORA deploy events. LLM Obs still differs.
    - ml-app:drift-digest
  links:
    - name: Repository
      type: repo
      provider: GitHub
      url: https://github.com/snacksnack/tpm-automation-platform
    - name: Delivery — CI pipelines & deploys
      type: dashboard
      url: https://app.datadoghq.com/dashboard/izc-5s7-tz8
spec:
  lifecycle: production
  tier: "2"
  languages:
    - python
  type: web
datadog:
  pipelines:
    fingerprints:
      - "XW5RFBnsxieQ"   # CI
      - "6Y55PGP48Xc_"   # CodeQL
      - "qTaPDMSrIgbU"   # Daily drift run
      - "pYmv1i8Q8Eg2"   # Datadog drift
      - "UpqzFZVpyGrj"   # Dependency Graph
      - "kZEYK2HEABLK"   # Fly Deploy
      - "bYMoD7EFCsWu"   # Security posture
  codeLocations:
    - repositoryURL: https://github.com/snacksnack/tpm-automation-platform
      paths:
        - "**"
