# fly.toml app configuration file generated for tpm-drift-detector on 2026-07-04T16:30:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tpm-drift-detector'
primary_region = 'iad'

[build]

[env]
  DB_PATH = '/data/drift.db'
  DRY_RUN = 'false'
  PROJECT_KEY = 'RC1'
  # RC1-447: name the APM service after the catalog entity and the DORA deploy
  # events, which both call it tpm-drift-detector. ddtrace defaulted it to
  # 'drift-service', so the catalog entry had no telemetry to join to. Nothing
  # queries the old name — the only service: filters in the account exclude
  # 'evals' and 'dry-run' — so this strands 397 spans nobody reads.
  DD_SERVICE = 'tpm-drift-detector'
  DD_ENV = 'prod'

[[mounts]]
  source = 'drift_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
